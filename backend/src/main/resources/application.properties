spring.application.name=gtm-planning

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/gtm_planning?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=gtm_user
spring.datasource.password=gtm_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# CORS (development)
app.cors.allowed-origins=http://localhost:5173
